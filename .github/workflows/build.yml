name: Build and regression checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test without proprietary assets
        run: ctest --test-dir build -C Release --output-on-failure --output-junit build/ctest-results.xml

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ctest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ctest-results.xml
          if-no-files-found: warn
