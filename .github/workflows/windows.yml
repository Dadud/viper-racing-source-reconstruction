name: Windows build and regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build game and regression executables
        run: cmake --build build --config Release --parallel

      - name: Run portable regression suite
        run: ctest --test-dir build -C Release --output-on-failure --output-junit build/ctest-results.xml

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ctest-results.xml
          if-no-files-found: warn
